{% extends "base.html" %}
{% block titulo %}Mi cuenta · Disponible{% endblock %}
{% block contenido %}
<div class="tarjeta angosta">
  <h1>Mi cuenta</h1>
  {% if u.cambiar_clave %}<p class="aviso">Antes de seguir, elegí una contraseña nueva (mínimo 10 caracteres).</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ P }}/cuenta">
    <label>Contraseña actual<input name="actual" type="password" autocomplete="current-password" required></label>
    <label>Contraseña nueva<input name="nueva" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Repetir la nueva<input name="repetir" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="primario">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
