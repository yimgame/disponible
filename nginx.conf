# Disponible de unidades: página del transporte (/cargar?t=<token>), panel (/panel/) y API para agentes (/api/v1/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $panel http://disponible-panel:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { try_files /index.html =404; }
    location = /cargar { try_files /cargar.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }

    location = /panel { return 301 /panel/; }
    location ^~ /panel/ {
        client_max_body_size 64k;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    # Importar exportes grandes (maestro de unidades ~9.000 filas, GCG ~5.000 con documentos).
    location ^~ /panel/api/importar/ {
        client_max_body_size 32m;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    # API para agentes (n8n): Authorization: Bearer <AGENTE_API_KEY>
    location ^~ /api/ {
        client_max_body_size 64k;
        proxy_pass $panel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
